# Render Blueprint — runs the VideoCraft Studio web app (web/ + video_engine.py).
# Every push to main redeploys automatically.
services:
  - type: web
    runtime: python
    name: videocraft-studio
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_VIDEO_SECONDS
        value: "180"
